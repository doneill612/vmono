name: release

# Pushing a v* tag (git tag v0.1.0 && git push origin v0.1.0) builds the
# archives, publishes the GitHub Release, then installs it with the real
# one-line installers on each OS to prove they work.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Only this job publishes, so only its token can write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -timeout 20m
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: install (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VMONO_VERSION: ${{ github.ref_name }}
    steps:
      - name: install (sh)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${VMONO_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install (powershell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://github.com/${{ github.repository }}/releases/download/$env:VMONO_VERSION/install.ps1" | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'Programs\vmono\bin')
      - name: check version
        shell: bash
        run: |
          out="$(vmono --version)"
          echo "$out"
          case "$out" in *"${VMONO_VERSION#v}"*) ;; *) echo "expected ${VMONO_VERSION#v} in: $out"; exit 1 ;; esac
