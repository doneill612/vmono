name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run it replaces. Runs on main each
# get a group of their own, so they always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The tests run git thousands of times. Git\cmd\git.exe is a launcher
      # that starts the real git, so put that one first.
      - name: use git without its launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\Git\mingw64\bin'
          if (Test-Path "$dir\git.exe") { Add-Content $env:GITHUB_PATH $dir }
      # D: is usually faster than C:, where the temp directory is.
      - name: keep temp files on D (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'D:\') {
            New-Item -ItemType Directory -Force 'D:\tmp' | Out-Null
            Add-Content $env:GITHUB_ENV "TEMP=D:\tmp"
            Add-Content $env:GITHUB_ENV "TMP=D:\tmp"
          }
      - name: git version
        run: git --version
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -timeout 20m
      - name: build
        run: go build ./cmd/vmono

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: shellcheck scripts/install.sh
        run: shellcheck scripts/install.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
