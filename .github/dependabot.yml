# Weekly update pull requests for Go modules and for the actions the workflows
# pin by commit SHA. The commit prefixes keep these out of the release notes.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
